<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Student Dashboard | DCURS</title>


<link rel="stylesheet" href="style.css">


<style>

body{
background:#f7f9fc;
}



.dashboard{

padding:60px 20px;

}



.container{

width:90%;
max-width:1200px;
margin:auto;

}



.dashboard-header{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}



.student-info h1{

color:#06244b;

}



.logout{

background:#b42318;

color:white;

padding:12px 25px;

border-radius:25px;

cursor:pointer;

}



.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

gap:25px;

}



.card{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

}



.card h2{

color:#06244b;

}



input,textarea{

width:100%;

padding:12px;

margin:8px 0;

border:1px solid #ddd;

border-radius:10px;

}



textarea{

height:120px;

}



button{

background:#06244b;

color:white;

border:none;

padding:12px 20px;

border-radius:25px;

cursor:pointer;

}



.status{

background:#fff3cd;

padding:8px 15px;

border-radius:20px;

}



.project{

border-bottom:1px solid #ddd;

padding:10px 0;

}



</style>


</head>



<body>



<header class="site-header">

<nav class="nav container">


<a class="brand" href="index.html">


<img src="assets/dcurs-logo.png">


<span>

<strong>
Dhaka Central University
</strong>


<small>
Research Society
</small>


</span>


</a>


</nav>

</header>








<section class="dashboard">


<div class="container">





<div class="dashboard-header">


<div class="student-info">


<h1 id="welcome">

Welcome Student

</h1>


<p>
DCURS Research Portal
</p>


</div>



<div class="logout" onclick="logout()">

Logout

</div>



</div>








<div class="cards">






<!-- PROFILE -->

<div class="card">


<h2>
👤 Profile
</h2>


<div id="profile">

Loading...

</div>


</div>









<!-- STATUS -->


<div class="card">


<h2>
Membership Status
</h2>


<span class="status" id="status">

Loading

</span>



</div>










<!-- PROJECT -->


<div class="card">


<h2>
🔬 Research Project
</h2>



<form id="projectForm">


<input id="title" placeholder="Project Title" required>


<input id="area" placeholder="Research Area" required>


<textarea id="abstract" placeholder="Project Abstract"></textarea>


<input id="supervisor" placeholder="Supervisor Name">


<button>

Submit Project

</button>


</form>


<p id="projectMessage"></p>



</div>









<!-- PUBLICATION -->


<div class="card">


<h2>
📄 Publication
</h2>



<form id="publicationForm">


<input id="pubTitle" placeholder="Publication Title" required>


<input id="journal" placeholder="Journal / Conference" required>


<input id="year" placeholder="Publication Year">


<input id="pubArea" placeholder="Research Area">


<input id="pubLink" placeholder="DOI / Link">



<button>

Submit Publication

</button>



</form>



<p id="pubMessage"></p>



</div>









<!-- MY PROJECT -->


<div class="card">


<h2>
My Research Projects
</h2>


<div id="myProjects">

Loading...

</div>


</div>









<!-- MY PUBLICATIONS -->


<div class="card">


<h2>
My Publications
</h2>


<div id="myPublications">

Loading...

</div>


</div>






</div>


</div>


</section>










<script>


const token = localStorage.getItem("token");


const user = JSON.parse(

localStorage.getItem("user")

);



if(!token || !user){

location.href="login.html";

}








function logout(){


localStorage.removeItem("token");

localStorage.removeItem("user");


location.href="login.html";


}









async function loadProfile(){



const res = await fetch(

"/api/profile/"+user.id

);



const data = await res.json();




document.getElementById(
"welcome"
).innerHTML=

"Welcome, "+data.name;




document.getElementById(
"profile"
).innerHTML=`

<p>Name: ${data.name}</p>

<p>Email: ${data.email}</p>

<p>Department: ${data.department}</p>

<p>Student ID: ${data.student_id}</p>

<p>Research Interest: ${data.research_interest}</p>

`;



document.getElementById(
"status"
).innerHTML=data.status;



}









// PROJECT SUBMIT


document
.getElementById("projectForm")
.addEventListener("submit",async(e)=>{


e.preventDefault();



await fetch("/api/projects",{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({


student_id:user.id,


title:title.value,


area:area.value,


abstract:abstract.value,


supervisor:supervisor.value


})


});



projectMessage.innerHTML=

"Project submitted successfully";


e.target.reset();


});









// PUBLICATION SUBMIT


document
.getElementById("publicationForm")
.addEventListener("submit",async(e)=>{


e.preventDefault();



const res=await fetch("/api/publications",{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({


student_id:user.id,


title:pubTitle.value,


journal:journal.value,


year:year.value,


area:pubArea.value,


link:pubLink.value


})


});



const data=await res.json();



pubMessage.innerHTML=data.message;



e.target.reset();


loadPublications();


});









// LOAD PROJECTS


async function loadProjects(){


const res=await fetch(

"/api/projects/student/"+user.id

);



const data=await res.json();



myProjects.innerHTML="";



data.forEach(p=>{


myProjects.innerHTML += `


<div class="project">

<b>${p.title}</b>

<p>${p.area}</p>

<p>Status: ${p.status}</p>

</div>


`;


});


}









// LOAD PUBLICATIONS


async function loadPublications(){


const res=await fetch(

"/api/publications/student/"+user.id

);



const data=await res.json();



myPublications.innerHTML="";



data.forEach(p=>{


myPublications.innerHTML += `


<div class="project">


<b>${p.title}</b>


<p>${p.journal}</p>


<p>Status: ${p.status}</p>


</div>


`;



});


}








loadProfile();

loadProjects();

loadPublications();



</script>


</body>

</html>
