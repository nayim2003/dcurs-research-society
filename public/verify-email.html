<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email | DCURS</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f7f9fc}
.box{max-width:650px;margin:90px auto;padding:38px;background:white;border:1px solid #e4e9f1;border-radius:22px;box-shadow:0 20px 50px rgba(6,36,75,.1);text-align:center}
.box h1{color:#06244b;margin-bottom:12px}
.box p{color:#667085}
.box a{display:inline-flex;margin-top:20px}
</style>
</head>
<body>
<main class="container">
<div class="box">
<p class="section-label">EMAIL VERIFICATION</p>
<h1 id="title">Verifying your email...</h1>
<p id="message">Please wait.</p>
<a id="loginLink" class="btn btn-primary" href="login.html" hidden>Go to Student Login</a>
</div>
</main>

<script>
(async function(){
  const token=new URLSearchParams(location.search).get("token");

  if(!token){
    title.innerText="Invalid verification link";
    message.innerText="The verification token is missing.";
    return;
  }

  try{
    const response=await fetch("/api/auth/verify-email",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token})
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||"Verification failed");
    }

    title.innerText="Email verified";
    message.innerText=data.message;
    loginLink.hidden=false;
  }catch(error){
    title.innerText="Verification failed";
    message.innerText=error.message;
  }
})();
</script>
</body>
</html>
