<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DCURS Admin Dashboard</title>

<link rel="stylesheet" href="style.css">


<style>

body{
background:#f7f9fc;
}


.container{
width:90%;
max-width:1200px;
margin:auto;
}


.admin{
padding:50px 20px;
}


.box{

background:white;
padding:30px;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

margin-bottom:30px;

}


input{

width:100%;
padding:12px;

margin:10px 0;

border:1px solid #ddd;

border-radius:10px;

}



button{

padding:10px 18px;

border:none;

border-radius:20px;

cursor:pointer;

background:#06244b;

color:white;

}



.approve{

background:#16a34a;

}



.reject{

background:#dc2626;

}



.logout{

float:right;

background:#b42318;

}



.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

}



.stat{

background:#06244b;

color:white;

padding:25px;

border-radius:20px;

}



.stat h1{

color:white;

margin:0;

}



table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th,td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:left;

}



th{

background:#eef4fb;

}


.hidden{

display:none;

}


</style>


</head>



<body>




<header class="site-header">

<nav class="nav container">


<a class="brand" href="index.html">

<img src="assets/dcurs-logo.png">


<span>

<strong>
Dhaka Central University
</strong>


<small>
Research Society
</small>


</span>


</a>


</nav>


</header>







<section class="admin">


<div class="container">





<!-- LOGIN -->


<div class="box" id="loginBox">


<h1>
Admin Login
</h1>



<form id="loginForm">


<input id="username" placeholder="Username" required>


<input id="password" type="password" placeholder="Password" required>


<button>

Login

</button>


</form>


<p id="error"></p>


</div>









<!-- DASHBOARD -->


<div id="dashboard" class="hidden">



<div class="box">


<button class="logout" onclick="logout()">

Logout

</button>


<h1>
DCURS Admin Dashboard
</h1>


</div>







<div class="stats">


<div class="stat">

<h1 id="total">

0

</h1>

<p>Total Students</p>

</div>



<div class="stat">

<h1 id="pending">

0

</h1>

<p>Pending</p>

</div>



<div class="stat">

<h1 id="approved">

0

</h1>

<p>Approved</p>

</div>



</div>









<!-- STUDENTS -->


<div class="box">


<h2>
🎓 Student Applications
</h2>



<table>


<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Department</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>


<tbody id="studentRows">


</tbody>


</table>



</div>









<!-- PROJECTS -->


<div class="box">


<h2>
🔬 Research Projects
</h2>



<table>


<thead>

<tr>

<th>Title</th>

<th>Area</th>

<th>Supervisor</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>


<tbody id="projectRows">


</tbody>


</table>


</div>









<!-- PUBLICATIONS -->


<div class="box">


<h2>
📄 Publications
</h2>



<table>


<thead>

<tr>

<th>Title</th>

<th>Journal</th>

<th>Year</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>


<tbody id="publicationRows">


</tbody>


</table>


</div>








</div>


</div>


</section>









<script>


let token = localStorage.getItem("adminToken");





const loginBox =
document.getElementById("loginBox");


const dashboard =
document.getElementById("dashboard");






if(token){

showDashboard();

}







document
.getElementById("loginForm")
.addEventListener("submit",async(e)=>{


e.preventDefault();



const response = await fetch(

"/api/admin/login",

{


method:"POST",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({


username:username.value,


password:password.value


})


}

);



const data = await response.json();



if(!response.ok){


error.innerHTML=data.error;


return;


}




token=data.token;



localStorage.setItem(

"adminToken",

token

);



showDashboard();



});









function showDashboard(){


loginBox.classList.add("hidden");


dashboard.classList.remove("hidden");


loadStudents();

loadProjects();

loadPublications();


}









async function loadStudents(){



const res = await fetch(

"/api/applications"

);



const data = await res.json();



let html="";


let p=0;

let a=0;



data.forEach(s=>{


if(s.status==="Pending")
p++;


if(s.status==="Approved")
a++;




html += `


<tr>


<td>${s.name}</td>

<td>${s.email}</td>

<td>${s.department || ""}</td>

<td>${s.status}</td>


<td>


<button class="approve"

onclick="studentStatus(${s.id},'Approved')">

Approve

</button>



<button class="reject"

onclick="studentStatus(${s.id},'Rejected')">

Reject

</button>


</td>


</tr>


`;



});



studentRows.innerHTML=html;


total.innerHTML=data.length;

pending.innerHTML=p;

approved.innerHTML=a;



}









async function studentStatus(id,status){


await fetch(

"/api/applications/"+id,

{


method:"PATCH",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({

status

})


}

);



loadStudents();


}









async function loadProjects(){



const res = await fetch(

"/api/projects"

);



const data = await res.json();



let html="";



data.forEach(p=>{


html += `


<tr>


<td>${p.title}</td>

<td>${p.area}</td>

<td>${p.supervisor}</td>

<td>${p.status}</td>


<td>


<button class="approve"

onclick="projectStatus(${p.id},'Approved')">

Approve

</button>


<button class="reject"

onclick="projectStatus(${p.id},'Rejected')">

Reject

</button>


</td>


</tr>


`;



});



projectRows.innerHTML=html;



}









async function projectStatus(id,status){


await fetch(

"/api/projects/"+id,

{


method:"PATCH",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

status

})


}

);



loadProjects();


}









async function loadPublications(){



const res = await fetch(

"/api/publications"

);



const data = await res.json();



let html="";



data.forEach(p=>{


html += `


<tr>


<td>${p.title}</td>

<td>${p.journal}</td>

<td>${p.year}</td>

<td>${p.status}</td>


<td>


<button class="approve"

onclick="publicationStatus(${p.id},'Approved')">

Approve

</button>


<button class="reject"

onclick="publicationStatus(${p.id},'Rejected')">

Reject

</button>


</td>


</tr>


`;



});



publicationRows.innerHTML=html;



}









async function publicationStatus(id,status){


await fetch(

"/api/publications/"+id,

{


method:"PATCH",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({

status

})


}

);



loadPublications();


}









function logout(){


localStorage.removeItem("adminToken");


location.reload();


}


</script>




</body>

</html>
