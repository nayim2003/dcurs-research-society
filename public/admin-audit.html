<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audit Logs | DCURS Admin</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f7f9fc;
}

.page{
  padding:55px 0 100px;
}

.head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  margin-bottom:28px;
}

.head h1{
  color:#06244b;
}

.back{
  display:inline-flex;
  padding:10px 16px;
  background:#06244b;
  color:white;
  border-radius:999px;
  font-weight:700;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:24px;
}

.stat{
  background:white;
  border:1px solid #e4e9f1;
  border-radius:16px;
  padding:20px;
}

.stat strong{
  display:block;
  font-size:30px;
  color:#06244b;
}

.stat span{
  font-size:12px;
  color:#667085;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.panel{
  background:white;
  border:1px solid #e4e9f1;
  border-radius:20px;
  padding:24px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 160px 130px auto;
  gap:10px;
  margin-bottom:18px;
}

.controls input,
.controls select{
  padding:11px 12px;
  border:1px solid #d6deea;
  border-radius:10px;
  background:white;
  font:inherit;
}

.controls button{
  border:0;
  background:#06244b;
  color:white;
  border-radius:999px;
  padding:10px 18px;
  cursor:pointer;
  font-weight:700;
}

.table-wrap{
  overflow:auto;
}

table{
  min-width:1050px;
}

.action-name{
  font-weight:700;
  color:#06244b;
}

.actor-label{
  font-size:12px;
  color:#667085;
}

.ip{
  font-family:monospace;
  font-size:12px;
}

details summary{
  cursor:pointer;
  font-weight:700;
  color:#06244b;
}

details pre{
  white-space:pre-wrap;
  word-break:break-word;
  max-width:450px;
  font-size:11px;
  color:#475569;
  margin-top:8px;
}

.pagination{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-top:20px;
}

.pagination button{
  border:1px solid #cbd5e1;
  background:white;
  color:#06244b;
  padding:9px 16px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}

.pagination button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

#pageInfo{
  color:#667085;
  font-size:13px;
}

.message{
  text-align:center;
  padding:30px;
  color:#667085;
}

@media(max-width:900px){
  .controls{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:520px){
  .stats{
    grid-template-columns:1fr;
  }

  .head{
    align-items:flex-start;
    flex-direction:column;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .pagination{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <nav class="nav container">

    <a class="brand" href="index.html">
      <img
        src="assets/dcurs-logo.png"
        alt="DCURS Logo"
      >

      <span>
        <strong>Dhaka Central University</strong>
        <small>Research Society</small>
      </span>
    </a>

    <div class="nav-links">
      <a href="admin.html">
        Admin Dashboard
      </a>

      <a href="admin-documents.html">
        Documents
      </a>
    </div>

  </nav>
</header>


<main class="page">

<div class="container">

  <div class="head">

    <div>
      <p class="section-label">
        SECURITY & ACTIVITY
      </p>

      <h1>Audit Logs</h1>
    </div>

    <a
      class="back"
      href="admin.html"
    >
      Back to Admin
    </a>

  </div>


  <div class="stats">

    <div class="stat">
      <strong id="total">0</strong>
      <span>Total Logs</span>
    </div>

    <div class="stat">
      <strong id="loaded">0</strong>
      <span>Loaded Logs</span>
    </div>

    <div class="stat">
      <strong id="failed">0</strong>
      <span>Failed Logins</span>
    </div>

    <div class="stat">
      <strong id="adminActions">0</strong>
      <span>Admin Actions</span>
    </div>

  </div>


  <section class="panel">

    <div class="controls">

      <input
        id="search"
        type="text"
        placeholder="Search action, e.g. login or document"
      >

      <select id="actorType">
        <option value="">
          All actors
        </option>

        <option value="admin">
          Admin
        </option>

        <option value="student">
          Student
        </option>

        <option value="system">
          System
        </option>
      </select>

      <select id="limit">
        <option value="25">
          25 logs
        </option>

        <option value="50">
          50 logs
        </option>

        <option value="100" selected>
          100 logs
        </option>
      </select>

      <button
        type="button"
        id="refreshBtn"
      >
        Refresh
      </button>

    </div>


    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Time</th>
            <th>Action</th>
            <th>Actor</th>
            <th>IP Address</th>
            <th>Details</th>
          </tr>
        </thead>

        <tbody id="rows">
          <tr>
            <td
              colspan="5"
              class="message"
            >
              Loading...
            </td>
          </tr>
        </tbody>

      </table>

    </div>


    <div class="pagination">

      <button
        type="button"
        id="previousBtn"
      >
        Previous
      </button>

      <span id="pageInfo">
        Page 1
      </span>

      <button
        type="button"
        id="nextBtn"
      >
        Next
      </button>

    </div>

  </section>

</div>

</main>


<script>
const adminToken =
  localStorage.getItem("adminToken");

const rows =
  document.getElementById("rows");

const searchInput =
  document.getElementById("search");

const actorType =
  document.getElementById("actorType");

const limitSelect =
  document.getElementById("limit");

const refreshBtn =
  document.getElementById("refreshBtn");

const previousBtn =
  document.getElementById("previousBtn");

const nextBtn =
  document.getElementById("nextBtn");

const pageInfo =
  document.getElementById("pageInfo");

const totalElement =
  document.getElementById("total");

const loadedElement =
  document.getElementById("loaded");

const failedElement =
  document.getElementById("failed");

const adminActionsElement =
  document.getElementById("adminActions");

let currentPage = 1;
let totalPages = 1;


if(!adminToken){
  location.href = "admin-login.html";
}


function headers(){
  return {
    Authorization:
      "Bearer " + adminToken
  };
}


async function adminFetch(url){

  const response =
    await fetch(
      url,
      {
        headers:headers()
      }
    );

  if(
    response.status === 401 ||
    response.status === 403
  ){
    localStorage.removeItem(
      "adminToken"
    );

    location.href =
      "admin.html";

    throw new Error(
      "Admin session expired"
    );
  }

  return response;
}


function createCell(value){

  const td =
    document.createElement("td");

  td.textContent =
    value === null ||
    value === undefined ||
    value === ""
      ? "—"
      : String(value);

  return td;
}


function renderLogs(logs){

  rows.replaceChildren();

  if(!logs.length){

    const tr =
      document.createElement("tr");

    const td =
      document.createElement("td");

    td.colSpan = 5;
    td.className = "message";
    td.textContent =
      "No audit logs found.";

    tr.appendChild(td);
    rows.appendChild(tr);

    return;
  }


  logs.forEach(log => {

    const tr =
      document.createElement("tr");


    /* TIME */

    const timeTd =
      document.createElement("td");

    const date =
      new Date(log.created_at);

    timeTd.textContent =
      Number.isNaN(date.getTime())
        ? "—"
        : date.toLocaleString();

    tr.appendChild(timeTd);


    /* ACTION */

    const actionTd =
      document.createElement("td");

    const actionStrong =
      document.createElement("strong");

    actionStrong.className =
      "action-name";

    actionStrong.textContent =
      log.action || "—";

    actionTd.appendChild(
      actionStrong
    );

    tr.appendChild(
      actionTd
    );


    /* ACTOR */

    const actorTd =
      document.createElement("td");

    const actorMain =
      document.createElement("div");

    actorMain.textContent =
      log.actor_type || "system";

    actorTd.appendChild(
      actorMain
    );


    if(
      log.actor_label ||
      log.actor_id
    ){

      const actorSub =
        document.createElement("div");

      actorSub.className =
        "actor-label";

      const parts = [];

      if(log.actor_label){
        parts.push(
          log.actor_label
        );
      }

      if(log.actor_id){
        parts.push(
          "#" + log.actor_id
        );
      }

      actorSub.textContent =
        parts.join(" ");

      actorTd.appendChild(
        actorSub
      );
    }

    tr.appendChild(
      actorTd
    );


    /* IP */

    const ipTd =
      document.createElement("td");

    ipTd.className =
      "ip";

    ipTd.textContent =
      log.ip_address || "—";

    tr.appendChild(
      ipTd
    );


    /* DETAILS */

    const detailsTd =
      document.createElement("td");

    const details =
      document.createElement("details");

    const summary =
      document.createElement("summary");

    summary.textContent =
      "View";

    const pre =
      document.createElement("pre");

    const displayData = {
      details:
        log.details || {}
    };

    if(log.user_agent){
      displayData.browser =
        log.user_agent;
    }

    pre.textContent =
      JSON.stringify(
        displayData,
        null,
        2
      );

    details.appendChild(
      summary
    );

    details.appendChild(
      pre
    );

    detailsTd.appendChild(
      details
    );

    tr.appendChild(
      detailsTd
    );


    rows.appendChild(
      tr
    );

  });
}


async function getCount(params){

  const query =
    new URLSearchParams({
      limit:"1",
      ...params
    });

  const response =
    await adminFetch(
      "/api/admin/audit-logs?" +
      query.toString()
    );

  const data =
    await response.json();

  if(!response.ok){
    return 0;
  }

  return Number(
    data.total || 0
  );
}


async function loadStats(){

  try{

    const [
      failedCount,
      adminCount
    ] =
      await Promise.all([

        getCount({
          action:"login_failed"
        }),

        getCount({
          actor_type:"admin"
        })

      ]);

    failedElement.textContent =
      failedCount;

    adminActionsElement.textContent =
      adminCount;

  }catch(error){

    console.error(
      "Audit stats error:",
      error
    );

  }
}


async function loadLogs(){

  try{

    rows.innerHTML =
      `<tr>
        <td
          colspan="5"
          class="message"
        >
          Loading...
        </td>
      </tr>`;


    const params =
      new URLSearchParams({
        page:String(currentPage),
        limit:limitSelect.value
      });


    const searchValue =
      searchInput.value.trim();

    if(searchValue){
      params.set(
        "action",
        searchValue
      );
    }


    if(actorType.value){
      params.set(
        "actor_type",
        actorType.value
      );
    }


    const response =
      await adminFetch(
        "/api/admin/audit-logs?" +
        params.toString()
      );


    const data =
      await response.json();


    if(!response.ok){

      rows.innerHTML =
        `<tr>
          <td
            colspan="5"
            class="message"
          >
            Unable to load audit logs.
          </td>
        </tr>`;

      return;
    }


    const logs =
      Array.isArray(data.logs)
        ? data.logs
        : [];


    totalElement.textContent =
      Number(data.total || 0);

    loadedElement.textContent =
      logs.length;


    currentPage =
      Number(data.page || 1);

    totalPages =
      Number(
        data.total_pages || 1
      );


    pageInfo.textContent =
      "Page " +
      currentPage +
      " of " +
      totalPages;


    previousBtn.disabled =
      currentPage <= 1;

    nextBtn.disabled =
      currentPage >= totalPages;


    renderLogs(logs);

  }catch(error){

    console.error(
      "Audit log error:",
      error
    );

    rows.innerHTML =
      `<tr>
        <td
          colspan="5"
          class="message"
        >
          Unable to load audit logs.
        </td>
      </tr>`;

  }
}


function refreshLogs(){

  currentPage = 1;

  loadLogs();
  loadStats();
}


refreshBtn.addEventListener(
  "click",
  refreshLogs
);


searchInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      refreshLogs();
    }

  }
);


actorType.addEventListener(
  "change",
  refreshLogs
);


limitSelect.addEventListener(
  "change",
  refreshLogs
);


previousBtn.addEventListener(
  "click",
  () => {

    if(currentPage > 1){

      currentPage--;

      loadLogs();

    }

  }
);


nextBtn.addEventListener(
  "click",
  () => {

    if(currentPage < totalPages){

      currentPage++;

      loadLogs();

    }

  }
);


loadStats();
loadLogs();
</script>


<script src="script.js"></script>

</body>
</html>
