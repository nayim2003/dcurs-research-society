<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>DCURS Admin Dashboard</title>


<link rel="stylesheet" href="style.css">


<style>


body{

background:#f7f9fc;

}


.container{

width:90%;

max-width:1200px;

margin:auto;

}



.admin{

padding:60px 20px;

}



.dashboard-box{

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}



.top{

display:flex;

justify-content:space-between;

align-items:center;

}



.logout{

background:#b42318;

color:white;

padding:12px 25px;

border-radius:30px;

cursor:pointer;

}




.stats{


display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

margin:30px 0;


}




.stat-card{


background:#06244b;

color:white;

padding:25px;

border-radius:20px;


}



.stat-card h2{

font-size:35px;

margin:0;

}





table{


width:100%;

border-collapse:collapse;

margin-top:30px;


}



th{

background:#eef4fb;

}



th,td{

padding:14px;

border-bottom:1px solid #ddd;

text-align:left;

}



button{


border:none;

padding:8px 15px;

border-radius:20px;

cursor:pointer;

}



.approve{

background:#16a34a;

color:white;

}



.reject{

background:#dc2626;

color:white;

}



.status{


padding:5px 12px;

border-radius:20px;

background:#fff3cd;

}



</style>


</head>


<body>



<header class="site-header">

<nav class="nav container">


<a class="brand" href="index.html">

<img src="assets/dcurs-logo.png">

<span>

<strong>
Dhaka Central University
</strong>

<small>
Research Society
</small>

</span>


</a>


</nav>

</header>







<section class="admin">


<div class="container">



<div class="dashboard-box">



<div class="top">


<h1>
DCURS Admin Panel
</h1>


<div class="logout" onclick="logout()">

Logout

</div>


</div>





<div class="stats">


<div class="stat-card">

<h2 id="total">
0
</h2>

<p>
Total Students
</p>


</div>




<div class="stat-card">

<h2 id="pending">
0
</h2>

<p>
Pending
</p>


</div>





<div class="stat-card">

<h2 id="approved">
0
</h2>

<p>
Approved
</p>


</div>



</div>







<table>


<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Department</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>


<tbody id="rows">


</tbody>


</table>




</div>



</div>



</section>








<script>


const token =
localStorage.getItem("adminToken");



if(!token){

window.location.href="admin.html";

}





async function loadStudents(){



const response = await fetch(

"/api/applications",

{

headers:{

Authorization:"Bearer "+token

}

}

);



const students =
await response.json();




rows.innerHTML="";



let pending=0;

let approved=0;



students.forEach(student=>{



if(student.status==="Pending")
pending++;


if(student.status==="Approved")
approved++;





rows.innerHTML += `


<tr>


<td>${student.name}</td>


<td>${student.email}</td>


<td>${student.department}</td>



<td>

<span class="status">

${student.status}

</span>


</td>



<td>


<button class="approve"

onclick="changeStatus(${student.id},'Approved')">

Approve

</button>



<button class="reject"

onclick="changeStatus(${student.id},'Rejected')">

Reject

</button>


</td>


</tr>


`;



});




total.innerHTML=students.length;

pending.innerHTML=pending;

approved.innerHTML=approved;



}








async function changeStatus(id,status){



await fetch(

"/api/applications/"+id,

{


method:"PATCH",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({

status

})


}

);



loadStudents();


}








function logout(){


localStorage.removeItem("adminToken");


location.href="admin.html";


}





loadStudents();



</script>



</body>


</html>
