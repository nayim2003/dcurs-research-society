<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Management | DCURS Admin</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f7f9fc}
.page{padding:60px 0 100px}
.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
.head h1{color:#06244b}
.panel{background:white;padding:26px;border-radius:20px;border:1px solid #e4e9f1;box-shadow:0 10px 30px rgba(6,36,75,.05)}
.table-wrap{overflow:auto}
table{min-width:1050px}
.action{border:0;color:#fff;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12px}
.approve{background:#16a34a}.reject{background:#b7791f}.delete{background:#b42318}.open{background:#0b356b}
.back{display:inline-flex;padding:10px 16px;border-radius:999px;background:#06244b;color:white}
</style>
</head>
<body>

<header class="site-header">
<nav class="nav container">
<a class="brand" href="index.html">
<img src="assets/dcurs-logo.png" alt="DCURS Logo">
<span><strong>Dhaka Central University</strong><small>Research Society</small></span>
</a>
<div class="nav-links">
<a href="admin.html">Admin Dashboard</a>
<a href="documents.html">Public Documents</a>
</div>
</nav>
</header>

<main class="page">
<div class="container">
<div class="head">
<div>
<p class="section-label">ADMIN DOCUMENTS</p>
<h1>PDF Review & Approval</h1>
</div>
<a class="back" href="admin.html">Back to Admin</a>
</div>

<div class="panel">
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Student</th><th>Campus</th><th>Title</th><th>Category</th><th>File</th><th>Status</th><th>Action</th>
</tr>
</thead>
<tbody id="rows">
<tr><td colspan="7">Loading documents...</td></tr>
</tbody>
</table>
</div>
</div>
</div>
</main>

<script>
let adminToken=localStorage.getItem("adminToken")||"";
if(!adminToken) location.href="admin.html";

function headers(json=false){
  const h={Authorization:"Bearer "+adminToken};
  if(json) h["Content-Type"]="application/json";
  return h;
}

function sizeText(bytes){
  const n=Number(bytes||0);
  if(!n) return "";
  return n<1024*1024?(n/1024).toFixed(1)+" KB":(n/(1024*1024)).toFixed(1)+" MB";
}

async function adminFetch(url,options={}){
  const r=await fetch(url,options);
  if(r.status===401||r.status===403){
    localStorage.removeItem("adminToken");
    location.href="admin.html";
    throw new Error("Admin session expired");
  }
  return r;
}

async function load(){
  const r=await adminFetch("/api/admin/documents",{headers:headers()});
  const d=await r.json();

  rows.innerHTML=d.length?d.map(doc=>`
    <tr>
      <td>${doc.student_name||""}<br><small>${doc.student_email||""}</small></td>
      <td>${doc.campus||""}</td>
      <td>${doc.title||""}<br><small>${doc.description||""}</small></td>
      <td>${doc.category||""}</td>
      <td>
        ${doc.original_name||"PDF"}<br>
        <small>${sizeText(doc.file_size)}</small><br>
        <a class="action open" href="${doc.file_url}" target="_blank" rel="noopener">Open PDF</a>
      </td>
      <td>${doc.status||""}</td>
      <td>
        <button class="action approve" onclick="setStatus(${doc.id},'Approved')">Approve</button>
        <button class="action reject" onclick="setStatus(${doc.id},'Rejected')">Reject</button>
        <button class="action delete" onclick="removeDoc(${doc.id})">Delete</button>
      </td>
    </tr>
  `).join(""):`<tr><td colspan="7">No documents uploaded yet.</td></tr>`;
}

async function setStatus(id,status){
  const r=await adminFetch("/api/admin/documents/"+id,{
    method:"PATCH",
    headers:headers(true),
    body:JSON.stringify({status})
  });
  const d=await r.json();
  if(!r.ok) alert(d.error||"Update failed");
  load();
}

async function removeDoc(id){
  if(!confirm("Delete this PDF permanently from cloud storage?")) return;
  const r=await adminFetch("/api/admin/documents/"+id,{
    method:"DELETE",
    headers:headers()
  });
  const d=await r.json();
  if(!r.ok) alert(d.error||"Delete failed");
  load();
}

load();
</script>
<script src="script.js"></script>
</body>
</html>
