<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | DCURS</title>

<link rel="stylesheet" href="style.css">

<style>
.login-section{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#f7f9fc,#eef4fb);
    padding:60px 20px;
}

.login-card{
    width:100%;
    max-width:430px;
    background:white;
    padding:40px;
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.12);
}

.login-logo{
    text-align:center;
    margin-bottom:25px;
}

.login-logo img{
    width:90px;
}

.login-card h1{
    text-align:center;
    color:#06244b;
    font-family:"Playfair Display",serif;
    font-size:38px;
    margin-bottom:10px;
}

.login-card p{
    text-align:center;
    color:#667085;
    margin-bottom:30px;
}

.login-card label{
    display:block;
    font-weight:600;
    color:#06244b;
    margin-bottom:15px;
}

.login-card input{
    width:100%;
    padding:14px;
    margin-top:7px;
    border:1px solid #d6deea;
    border-radius:10px;
    font-size:15px;
}

.login-card button{
    width:100%;
    margin-top:20px;
    border:none;
    cursor:pointer;
}

.login-footer{
    text-align:center;
    margin-top:25px;
    color:#667085;
}

.login-footer a{
    color:#06244b;
    font-weight:700;
}

#error{
    color:#b42318;
    text-align:center;
    margin-top:15px;
}
</style>

</head>

<body>

<header class="site-header">

<nav class="nav container">

<a class="brand" href="index.html">
<img src="assets/dcurs-logo.png" alt="DCURS Logo">
<span>
<strong>Dhaka Central University</strong>
<small>Research Society</small>
</span>
</a>

</nav>

</header>


<section class="login-section">

<div class="login-card">

<div class="login-logo">
<img src="assets/dcurs-logo.png" alt="DCURS">
</div>


<h1>Student Login</h1>

<p>
Access your DCURS student portal
</p>


<form id="loginForm">

<label>
Email Address
<input 
type="email" 
name="email"
placeholder="Enter your email"
required>
</label>


<label>
Password
<input 
type="password"
name="password"
placeholder="Enter your password"
required>
</label>


<button class="btn btn-primary" type="submit">
Login
</button>


</form>


<div id="error"></div>


<div class="login-footer">

New student?

<a href="register.html">
Create Account
</a>

</div>


</div>

</section>


<script>

document.getElementById("loginForm").addEventListener("submit", async function(e){

e.preventDefault();


const data = Object.fromEntries(
new FormData(this)
);


try{

const response = await fetch("/api/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

});


const result = await response.json();


if(!response.ok){

throw new Error(result.error);

}


// পরে dashboard যোগ হলে এখানে redirect হবে

localStorage.setItem("token", result.token);
window.location.href="student-dashboard.html";


}

catch(error){

document.getElementById("error").innerText = error.message;

}


});


</script>


</body>
</html>
