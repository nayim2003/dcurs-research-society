<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>DCURS Publications Archive</title>

<link rel="stylesheet" href="style.css">


<style>

body{
background:#f7f9fc;
}


.container{

width:90%;
max-width:1200px;
margin:auto;

}


.publications{

padding:60px 20px;

}



.title{

color:#06244b;

font-size:42px;

margin-bottom:40px;

}



.card{

background:white;

padding:30px;

border-radius:20px;

margin-bottom:25px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

}



.card h2{

color:#06244b;

}



.card p{

color:#64748b;

line-height:1.7;

}



.badge{

display:inline-block;

background:#d1fadf;

color:#067647;

padding:8px 18px;

border-radius:20px;

font-weight:600;

}



.empty{

background:white;

padding:30px;

border-radius:20px;

text-align:center;

color:#64748b;

}



</style>


</head>


<body>




<header class="site-header">


<nav class="nav container">


<a class="brand" href="index.html">


<img src="assets/dcurs-logo.png">


<span>

<strong>
Dhaka Central University
</strong>

<small>
Research Society
</small>


</span>


</a>


</nav>


</header>







<section class="publications">


<div class="container">



<h1 class="title">

DCURS Publication Archive

</h1>



<div id="publications">

Loading publications...

</div>



</div>


</section>









<script>


async function loadPublications(){



const box=document.getElementById(
"publications"
);



try{


const response = await fetch(

"/api/public/publications"

);



const data = await response.json();




if(data.length===0){


box.className="empty";


box.innerHTML=

"No approved publications available yet.";


return;


}



box.innerHTML="";





data.forEach(pub=>{


box.innerHTML += `


<div class="card">


<h2>

${pub.title}

</h2>



<p>

<strong>
Journal / Conference:
</strong>

${pub.journal || "Not specified"}

</p>



<p>

<strong>
Year:
</strong>

${pub.year || "Not specified"}

</p>



<p>

<strong>
Research Area:
</strong>

${pub.area || "Not specified"}

</p>



<p>

<strong>
Author:
</strong>

${pub.name}

</p>



<p>

<strong>
Department:
</strong>

${pub.department}

</p>




${pub.link ? 

`<p>

<a href="${pub.link}" target="_blank">

View Paper

</a>

</p>` 

: ""}



<span class="badge">

Approved Publication

</span>



</div>


`;



});



}

catch(error){


console.log(error);



box.className="empty";


box.innerHTML=

"Unable to load publications.";



}



}



loadPublications();



</script>





</body>

</html>
