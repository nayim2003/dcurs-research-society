<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DCURS Admin Dashboard</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><nav class="nav container"><a class="brand" href="index.html"><img src="assets/dcurs-logo.png"><span><strong>DCURS</strong><small>Admin Dashboard</small></span></a><div class="nav-links"><a href="index.html">Website</a><a href="join.html">Membership</a></div></nav></header>
<main><section class="section"><div class="container">
<div id="login"><p class="section-label">SECURE ADMIN</p><h1 class="admin-title">Sign in</h1><form id="loginForm" class="form-box"><label>Username<input id="username" required></label><label>Password<input id="password" type="password" required></label><button class="btn btn-primary">Sign in</button></form></div>
<div id="dashboard" style="display:none"><div class="admin-head"><div><p class="section-label">ADMIN</p><h1 class="admin-title">Applications</h1></div><button class="btn btn-secondary" id="logout">Log out</button></div>
<div class="admin-stats"><div><strong id="total">0</strong><span>Total</span></div><div><strong id="pending">0</strong><span>Pending</span></div><div><strong id="approved">0</strong><span>Approved</span></div></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Campus</th><th>Email</th><th>Interests</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div></section></main>
<script>
let token='';
const $=id=>document.getElementById(id);
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const r=await fetch('/api/admin/login',{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
username:$('#username').value,
password:$('#password').value
})
});
 const d=await r.json(); if(!r.ok)return alert(d.error||'Login failed');
 token = d.token;

localStorage.setItem("adminToken", token);

document.getElementById("login").style.display="none";
document.getElementById("dashboard").style.display="block";

load();
});
async function load(){
 const r=await fetch('/api/applications',{headers:{Authorization:'Bearer '+token}});
 if(r.status===401)return logout();
 const apps=await r.json();$('rows').innerHTML='';
 apps.forEach(a=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${a.id}</td><td>${a.name}</td><td>${a.department}</td><td>${a.campus}</td><td>${a.email}</td><td>${a.interests}</td><td><span class="status ${a.status.toLowerCase()}">${a.status}</span></td><td><button class="small-btn" onclick="setStatus('${a.id}','${a.status==='Pending'?'Approved':'Pending'}')">${a.status==='Pending'?'Approve':'Reset'}</button></td>`;$('rows').appendChild(tr)});
 $('total').textContent=apps.length;$('pending').textContent=apps.filter(x=>x.status==='Pending').length;$('approved').textContent=apps.filter(x=>x.status==='Approved').length;
}
async function setStatus(id,status){await fetch('/api/applications/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status})});load()}
function logout(){token='';$('dashboard').hidden=true;$('login').hidden=false}
$('logout').onclick=logout;
</script></body></html>
