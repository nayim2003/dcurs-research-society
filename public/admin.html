<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DCURS Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f6f8fc;
}


.container{

width:90%;
max-width:1200px;
margin:auto;

}


.admin{

padding:50px 20px;

}


.card{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

margin-bottom:30px;

}



h1,h2{

color:#06244b;

}



button{

border:none;

padding:10px 18px;

border-radius:20px;

cursor:pointer;

color:white;

background:#06244b;

margin:3px;

}



.approve{

background:#16a34a;

}


.reject{

background:#dc2626;

}



.logout{

float:right;

background:#b42318;

}



.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

}



.stat{

background:#06244b;

color:white;

padding:25px;

border-radius:20px;

}



.stat h1{

color:white;

margin:0;

}



table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#eef4fb;

}



td,th{

padding:14px;

border-bottom:1px solid #ddd;

text-align:left;

}



</style>

</head>


<body>



<header class="site-header">

<nav class="nav container">


<a class="brand" href="index.html">


<img src="assets/dcurs-logo.png">


<span>

<strong>
Dhaka Central University
</strong>

<small>
Research Society
</small>

</span>


</a>


</nav>

</header>






<section class="admin">


<div class="container">



<div class="card">


<button class="logout" onclick="logout()">

Logout

</button>


<h1>
DCURS Admin Dashboard
</h1>


</div>







<div class="stats">


<div class="stat">

<h1 id="total">
0
</h1>

<p>
Total Students
</p>

</div>


<div class="stat">

<h1 id="pending">
0
</h1>

<p>
Pending
</p>

</div>



<div class="stat">

<h1 id="approved">
0
</h1>

<p>
Approved
</p>

</div>


</div>








<div class="card">


<h2>
🎓 Student Applications
</h2>



<table>


<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Department</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>


<tbody id="studentRows">


</tbody>


</table>



</div>









<div class="card">


<h2>
🔬 Research Projects
</h2>


<table>


<thead>


<tr>

<th>Title</th>

<th>Area</th>

<th>Supervisor</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>


<tbody id="projectRows">


</tbody>


</table>


</div>




</div>


</section>







<script>


// ==========================
// LOAD STUDENTS
// ==========================


async function loadStudents(){


try{


const response = await fetch(

"/api/applications"

);



const students = await response.json();



console.log(
"Students:",
students
);



let html="";


let pending=0;

let approved=0;



students.forEach(student=>{


if(student.status==="Pending")
pending++;


if(student.status==="Approved")
approved++;




html += `


<tr>


<td>${student.name}</td>


<td>${student.email}</td>


<td>${student.department || ""}</td>


<td>${student.status}</td>



<td>


<button class="approve"

onclick="changeStudentStatus(${student.id},'Approved')">

Approve

</button>



<button class="reject"

onclick="changeStudentStatus(${student.id},'Rejected')">

Reject

</button>


</td>



</tr>


`;



});




document.getElementById(
"studentRows"
).innerHTML=html;




document.getElementById(
"total"
).innerHTML=students.length;



document.getElementById(
"pending"
).innerHTML=pending;



document.getElementById(
"approved"
).innerHTML=approved;



}

catch(error){


console.log(
"Student Load Error:",
error
);


}



}









// ==========================
// UPDATE STUDENT STATUS
// ==========================


async function changeStudentStatus(id,status){



await fetch(

"/api/applications/"+id,

{


method:"PATCH",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({

status:status

})


}

);



loadStudents();


}









// ==========================
// LOAD PROJECTS
// ==========================


async function loadProjects(){


try{


const response = await fetch(

"/api/projects"

);



const projects = await response.json();



console.log(
"Projects:",
projects
);



let html="";



projects.forEach(project=>{


html += `


<tr>


<td>${project.title}</td>


<td>${project.area}</td>


<td>${project.supervisor}</td>


<td>${project.status}</td>



<td>


<button class="approve"

onclick="changeProjectStatus(${project.id},'Approved')">

Approve

</button>



<button class="reject"

onclick="changeProjectStatus(${project.id},'Rejected')">

Reject

</button>


</td>



</tr>


`;



});



document.getElementById(
"projectRows"
).innerHTML=html;



}

catch(error){


console.log(
"Project Load Error:",
error
);


}


}








async function changeProjectStatus(id,status){


await fetch(

"/api/projects/"+id,

{


method:"PATCH",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({

status:status

})


}

);



loadProjects();


}








function logout(){


localStorage.removeItem(
"adminToken"
);


location.reload();


}







// START


loadStudents();

loadProjects();



</script>



</body>


</html>
