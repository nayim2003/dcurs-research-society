<h2>Login</h2><form id=f><input name=email><input name=password type=password><button>Login</button></form><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});alert(await r.text())}</script>
