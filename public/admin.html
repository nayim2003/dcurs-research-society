<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DCURS Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f7f9fc;
}


.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}


.admin-section{
    padding:60px 0;
}


.login-box,
.dashboard-box{

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:0 15px 40px rgba(0,0,0,.1);

}


.login-box{

    max-width:420px;

    margin:50px auto;

}


h1,h2{

    color:#06244b;

}


input{

    width:100%;

    padding:14px;

    margin:10px 0;

    border-radius:10px;

    border:1px solid #ddd;

}


button{

    background:#06244b;

    color:white;

    border:none;

    padding:12px 25px;

    border-radius:25px;

    cursor:pointer;

}


.logout{

    float:right;

    background:#b42318;

}


table{

    width:100%;

    border-collapse:collapse;

    margin-top:30px;

}


th,td{

    padding:12px;

    border-bottom:1px solid #ddd;

    text-align:left;

}


.status{

    padding:5px 12px;

    border-radius:20px;

}


.pending{

    background:#fff3cd;

}


.approved{

    background:#d1fadf;

}


</style>


</head>


<body>


<header class="site-header">

<nav class="nav container">


<a class="brand" href="index.html">

<img src="assets/dcurs-logo.png">

<span>

<strong>
Dhaka Central University
</strong>

<small>
Research Society
</small>

</span>


</a>


</nav>

</header>




<section class="admin-section">


<div class="container">



<!-- LOGIN -->

<div id="login" class="login-box">


<h1>
Admin Login
</h1>


<form id="loginForm">


<input 
id="username"
placeholder="Username"
required>



<input 
id="password"
type="password"
placeholder="Password"
required>



<button type="submit">
Login
</button>


</form>


</div>





<!-- DASHBOARD -->


<div id="dashboard" class="dashboard-box" style="display:none;">


<button class="logout" onclick="logout()">
Logout
</button>


<h1>
DCURS Admin Dashboard
</h1>



<h2>
Student Applications
</h2>




<table>


<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Department</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>


<tbody id="rows">

</tbody>


</table>


</div>




</div>


</section>





<script>


let token="";


const $ = id => document.getElementById(id);



const savedToken =
localStorage.getItem("adminToken");


if(savedToken){

token=savedToken;

}





loginForm.addEventListener(
"submit",
async function(e){


e.preventDefault();



const response =
await fetch("/api/admin/login",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


username:username.value,


password:password.value


})


});



const data =
await response.json();



if(!response.ok){


alert(data.error || "Login failed");

return;


}




token=data.token;


localStorage.setItem(
"adminToken",
token
);



$("login").style.display="none";


$("dashboard").style.display="block";


loadApplications();



});






async function loadApplications(){


const response =
await fetch("/api/applications",{


headers:{


Authorization:
"Bearer "+token


}


});



if(!response.ok){

return;

}



const apps =
await response.json();



rows.innerHTML="";



apps.forEach(app=>{


rows.innerHTML += `

<tr>

<td>${app.id}</td>

<td>${app.name}</td>

<td>${app.email}</td>

<td>${app.department}</td>

<td>

<span class="status">

${app.status}

</span>

</td>


<td>


<button onclick="updateStatus('${app.id}','Approved')">

Approve

</button>



<button onclick="updateStatus('${app.id}','Rejected')">

Reject

</button>


</td>


</tr>


`;


});


}





async function updateStatus(id,status){


await fetch("/api/applications/"+id,{


method:"PATCH",


headers:{


"Content-Type":"application/json",

Authorization:
"Bearer "+token


},


body:JSON.stringify({

status:status

})


});


loadApplications();


}





function logout(){


localStorage.removeItem("adminToken");


location.reload();


}




</script>



</body>

</html>
