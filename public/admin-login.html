<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | DCURS</title>
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;background:#f5f7fb;display:flex;align-items:center;justify-content:center}
.admin-login{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e3e8f0;border-radius:22px;padding:32px;box-shadow:0 20px 60px rgba(6,36,75,.10)}
.admin-login img{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto 18px}
.admin-login h1{text-align:center;color:#06244b;margin:0 0 7px}
.admin-login .sub{text-align:center;color:#667085;margin:0 0 25px}
.admin-login label{display:block;font-weight:700;color:#344054;margin:14px 0 7px}
.admin-login input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d6deea;border-radius:11px;font:inherit}
.admin-login button{width:100%;margin-top:22px;border:0;border-radius:999px;padding:13px;background:#06244b;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.admin-login button:disabled{opacity:.65;cursor:wait}
#message{min-height:20px;margin-top:14px;text-align:center;font-size:13px;color:#b42318}
.back{display:block;text-align:center;margin-top:18px;color:#475467;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<main class="admin-login">
<img src="assets/dcurs-logo.png" alt="DCURS">
<h1>Admin Login</h1>
<p class="sub">DCURS Administration Panel</p>

<form id="loginForm">
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" required>

<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>

<button id="loginBtn" type="submit">Sign in</button>
<div id="message" role="alert"></div>
</form>

<a class="back" href="index.html">← Back to website</a>
</main>

<script>
const form=document.getElementById("loginForm");
const btn=document.getElementById("loginBtn");
const message=document.getElementById("message");

form.addEventListener("submit",async(event)=>{
  event.preventDefault();
  message.textContent="";
  btn.disabled=true;

  try{
    const response=await fetch("/api/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:document.getElementById("username").value.trim(),
        password:document.getElementById("password").value
      })
    });

    const data=await response.json();

    if(!response.ok){
      message.textContent=data.error||"Unable to sign in.";
      return;
    }

    if(!data.token){
      message.textContent="Login failed: no admin token received.";
      return;
    }

    localStorage.setItem("adminToken",data.token);
    window.location.href="admin.html";
  }catch(error){
    console.error(error);
    message.textContent="Unable to connect to the server.";
  }finally{
    btn.disabled=false;
  }
});
</script>
</body>
</html>
