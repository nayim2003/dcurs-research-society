<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCURS Audit Logs</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f7f9fc;
    }

    .audit-page {
      padding: 55px 0 80px;
    }

    .audit-shell {
      background: #fff;
      border: 1px solid #e4e9f1;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 18px 50px rgba(6, 36, 75, .08);
    }

    .audit-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .audit-head h1 {
      color: #06244b;
      margin-bottom: 6px;
    }

    .audit-head p {
      color: #667085;
      font-size: 14px;
    }

    .audit-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .audit-btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: #06244b;
      color: #fff;
      text-decoration: none;
    }

    .audit-btn.secondary {
      background: #fff;
      color: #06244b;
      border: 1px solid #cbd5e1;
    }

    .audit-btn.danger {
      background: #b42318;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.6fr 1fr auto;
      gap: 12px;
      margin-bottom: 20px;
    }

    .filters input,
    .filters select {
      width: 100%;
      border: 1px solid #d6deea;
      border-radius: 10px;
      padding: 11px 12px;
      background: #fff;
      font: inherit;
      outline: none;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      margin-bottom: 12px;
      color: #667085;
      font-size: 13px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid #e4e9f1;
      border-radius: 14px;
    }

    .audit-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
      background: #fff;
    }

    .audit-table th,
    .audit-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #e4e9f1;
      text-align: left;
      vertical-align: top;
      font-size: 12px;
    }

    .audit-table th {
      background: #f7f9fc;
      color: #06244b;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: 10px;
    }

    .audit-table tr:last-child td {
      border-bottom: 0;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eef4fb;
      color: #0b356b;
      font-weight: 800;
      font-size: 10px;
      text-transform: uppercase;
    }

    .action-name {
      font-weight: 800;
      color: #06244b;
      overflow-wrap: anywhere;
    }

    .details {
      max-width: 300px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #475467;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .muted-text {
      color: #98a2b3;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .pager button {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #06244b;
      border-radius: 9px;
      padding: 8px 13px;
      cursor: pointer;
      font-weight: 700;
    }

    .pager button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .message {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: none;
    }

    .message.error {
      display: block;
      background: #fff1f0;
      color: #b42318;
      border: 1px solid #f4c7c3;
    }

    @media (max-width: 760px) {
      .audit-head {
        flex-direction: column;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .audit-shell {
        padding: 20px;
      }

      .summary {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="index.html">
        <img src="assets/dcurs-logo.png" alt="DCURS">
        <span>
          <strong>Dhaka Central University</strong>
          <small>Research Society</small>
        </span>
      </a>
    </nav>
  </header>

  <main class="audit-page">
    <div class="container">
      <section class="audit-shell">
        <div class="audit-head">
          <div>
            <p class="section-label">ADMIN SECURITY</p>
            <h1>Audit Log Dashboard</h1>
            <p>
              Review administrative actions, login events and other
              recorded activity.
            </p>
          </div>

          <div class="audit-actions">
            <a class="audit-btn secondary" href="admin.html">
              Back to Admin
            </a>
            <button class="audit-btn" id="refreshBtn" type="button">
              Refresh
            </button>
            <button class="audit-btn danger" id="logoutBtn" type="button">
              Logout
            </button>
          </div>
        </div>

        <div id="message" class="message"></div>

        <div class="filters">
          <input
            id="actionFilter"
            type="search"
            maxlength="120"
            placeholder="Search action, e.g. admin_login"
          >

          <select id="actorFilter">
            <option value="">All actor types</option>
            <option value="admin">Admin</option>
            <option value="student">Student</option>
            <option value="system">System</option>
          </select>

          <button class="audit-btn" id="filterBtn" type="button">
            Apply Filter
          </button>
        </div>

        <div class="summary">
          <span id="resultSummary">Loading audit logs...</span>
          <span id="pageSummary"></span>
        </div>

        <div class="table-wrap">
          <table class="audit-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Action</th>
                <th>Actor</th>
                <th>Details</th>
                <th>IP</th>
                <th>User Agent</th>
              </tr>
            </thead>
            <tbody id="auditRows"></tbody>
          </table>
        </div>

        <div class="pager">
          <button id="prevBtn" type="button">Previous</button>
          <button id="nextBtn" type="button">Next</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const token = localStorage.getItem("adminToken");

    if (!token) {
      window.location.href = "admin.html";
    }

    const state = {
      page: 1,
      totalPages: 1,
      limit: 25
    };

    const rows = document.getElementById("auditRows");
    const message = document.getElementById("message");
    const resultSummary = document.getElementById("resultSummary");
    const pageSummary = document.getElementById("pageSummary");
    const actionFilter = document.getElementById("actionFilter");
    const actorFilter = document.getElementById("actorFilter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function showError(text) {
      message.textContent = text;
      message.className = "message error";
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function formatDate(value) {
      if (!value) return "—";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "—";
      }

      return date.toLocaleString();
    }

    function createCell(text, className = "") {
      const td = document.createElement("td");

      if (className) {
        td.className = className;
      }

      td.textContent = text;
      return td;
    }

    function renderLogs(logs) {
      rows.replaceChildren();

      if (!Array.isArray(logs) || logs.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");

        td.colSpan = 6;
        td.textContent = "No audit logs found.";
        td.className = "muted-text";
        td.style.textAlign = "center";
        td.style.padding = "30px";

        tr.appendChild(td);
        rows.appendChild(tr);
        return;
      }

      logs.forEach(log => {
        const tr = document.createElement("tr");

        tr.appendChild(createCell(formatDate(log.created_at)));

        const actionTd = createCell(log.action || "—", "action-name");
        tr.appendChild(actionTd);

        const actorTd = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = log.actor_type || "system";
        actorTd.appendChild(badge);

        const actorLine = document.createElement("div");
        actorLine.style.marginTop = "6px";
        actorLine.className = "muted-text";

        if (log.actor_label) {
          actorLine.textContent = log.actor_label;
        } else if (log.actor_id) {
          actorLine.textContent = `ID: ${log.actor_id}`;
        } else {
          actorLine.textContent = "—";
        }

        actorTd.appendChild(actorLine);
        tr.appendChild(actorTd);

        const detailsTd = document.createElement("td");
        const detailsCode = document.createElement("code");
        detailsCode.className = "details";
        detailsCode.textContent = JSON.stringify(
          log.details || {},
          null,
          2
        );
        detailsTd.appendChild(detailsCode);
        tr.appendChild(detailsTd);

        tr.appendChild(createCell(log.ip_address || "—"));

        const ua = String(log.user_agent || "—");
        tr.appendChild(
          createCell(
            ua.length > 90 ? ua.slice(0, 90) + "…" : ua,
            "muted-text"
          )
        );

        rows.appendChild(tr);
      });
    }

    async function loadLogs() {
      clearMessage();

      const params = new URLSearchParams({
        page: String(state.page),
        limit: String(state.limit)
      });

      const action = actionFilter.value.trim();
      const actor = actorFilter.value;

      if (action) {
        params.set("action", action);
      }

      if (actor) {
        params.set("actor_type", actor);
      }

      try {
        const response = await fetch(
          `/api/admin/audit-logs?${params.toString()}`,
          {
            headers: {
              Authorization: `Bearer ${token}`
            }
          }
        );

        if (response.status === 401 || response.status === 403) {
          localStorage.removeItem("adminToken");
          window.location.href = "admin.html";
          return;
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Unable to load audit logs");
        }

        state.totalPages = Number(data.total_pages) || 1;

        if (state.page > state.totalPages) {
          state.page = state.totalPages;
          return loadLogs();
        }

        renderLogs(data.logs);

        resultSummary.textContent =
          `${data.total || 0} audit log(s) found`;

        pageSummary.textContent =
          `Page ${state.page} of ${state.totalPages}`;

        prevBtn.disabled = state.page <= 1;
        nextBtn.disabled = state.page >= state.totalPages;
      } catch (error) {
        showError(error.message || "Unable to load audit logs");
        renderLogs([]);
      }
    }

    document.getElementById("filterBtn").addEventListener(
      "click",
      () => {
        state.page = 1;
        loadLogs();
      }
    );

    document.getElementById("refreshBtn").addEventListener(
      "click",
      loadLogs
    );

    actionFilter.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        state.page = 1;
        loadLogs();
      }
    });

    prevBtn.addEventListener("click", () => {
      if (state.page > 1) {
        state.page -= 1;
        loadLogs();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (state.page < state.totalPages) {
        state.page += 1;
        loadLogs();
      }
    });

    document.getElementById("logoutBtn").addEventListener(
      "click",
      () => {
        localStorage.removeItem("adminToken");
        window.location.href = "admin.html";
      }
    );

    loadLogs();
  </script>
</body>
</html>
