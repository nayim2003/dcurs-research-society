<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Logs | DCURS Admin</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f7f9fc}
.page{padding:55px 0 100px}
.head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}
.head h1{color:#06244b}
.back{display:inline-flex;padding:10px 16px;background:#06244b;color:white;border-radius:999px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:white;border:1px solid #e4e9f1;border-radius:16px;padding:20px}
.stat strong{display:block;font-size:30px;color:#06244b}
.stat span{font-size:12px;color:#667085;text-transform:uppercase;letter-spacing:.08em}
.panel{background:white;border:1px solid #e4e9f1;border-radius:20px;padding:24px}
.controls{display:grid;grid-template-columns:1fr 140px auto;gap:10px;margin-bottom:18px}
.controls input,.controls select{padding:11px 12px;border:1px solid #d6deea;border-radius:10px;background:white}
.controls button{border:0;background:#06244b;color:white;border-radius:999px;padding:10px 18px;cursor:pointer}
.table-wrap{overflow:auto}
table{min-width:1000px}
details pre{white-space:pre-wrap;max-width:420px;font-size:11px;color:#475569}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}}
@media(max-width:520px){.stats{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<header class="site-header">
<nav class="nav container">
<a class="brand" href="index.html">
<img src="assets/dcurs-logo.png" alt="DCURS Logo">
<span>
<strong>Dhaka Central University</strong>
<small>Research Society</small>
</span>
</a>
<div class="nav-links">
<a href="admin.html">Admin Dashboard</a>
<a href="admin-documents.html">Documents</a>
</div>
</nav>
</header>

<main class="page">
<div class="container">

<div class="head">
<div>
<p class="section-label">SECURITY & ACTIVITY</p>
<h1>Audit Logs</h1>
</div>
<a class="back" href="admin.html">Back to Admin</a>
</div>

<div class="stats">
<div class="stat"><strong id="total">0</strong><span>Total logs</span></div>
<div class="stat"><strong id="last24">0</strong><span>Last 24 hours</span></div>
<div class="stat"><strong id="failed">0</strong><span>Failed logins</span></div>
<div class="stat"><strong id="adminActions">0</strong><span>Admin actions</span></div>
</div>

<section class="panel">
<div class="controls">
<input id="search" placeholder="Filter by action, e.g. login or document">
<select id="limit">
<option value="50">50 logs</option>
<option value="100" selected>100 logs</option>
<option value="250">250 logs</option>
<option value="500">500 logs</option>
</select>
<button onclick="loadLogs()">Refresh</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Time</th>
<th>Action</th>
<th>Actor</th>
<th>Target</th>
<th>Details</th>
</tr>
</thead>
<tbody id="rows">
<tr><td colspan="5">Loading...</td></tr>
</tbody>
</table>
</div>
</section>

</div>
</main>

<script>
const adminToken=localStorage.getItem("adminToken");

if(!adminToken){
  location.href="admin.html";
}

function headers(){
  return {
    Authorization:"Bearer "+adminToken
  };
}

async function adminFetch(url){
  const response=await fetch(url,{headers:headers()});

  if(response.status===401 || response.status===403){
    localStorage.removeItem("adminToken");
    location.href="admin.html";
    throw new Error("Admin session expired");
  }

  return response;
}

function text(value){
  return value===null || value===undefined || value===""
    ? "—"
    : String(value);
}

async function loadStats(){
  const response=await adminFetch("/api/admin/audit-logs/stats");
  const data=await response.json();

  if(!response.ok) return;

  total.innerText=data.total||0;
  last24.innerText=data.last_24_hours||0;
  failed.innerText=data.failed_logins||0;
  adminActions.innerText=data.admin_actions||0;
}

async function loadLogs(){
  const params=new URLSearchParams({
    limit:limit.value
  });

  if(search.value.trim()){
    params.set("action",search.value.trim());
  }

  const response=await adminFetch(
    "/api/admin/audit-logs?"+params.toString()
  );

  const data=await response.json();

  if(!response.ok){
    rows.innerHTML=
      `<tr><td colspan="5">${data.error||"Unable to load audit logs"}</td></tr>`;
    return;
  }

  rows.innerHTML=data.length
    ? data.map(log=>`
      <tr>
        <td>${new Date(log.created_at).toLocaleString()}</td>
        <td><strong>${text(log.action)}</strong></td>
        <td>
          ${text(log.actor_type)}
          ${log.actor_id ? "#"+log.actor_id : ""}
        </td>
        <td>
          ${text(log.target_type)}
          ${log.target_id ? "#"+log.target_id : ""}
        </td>
        <td>
          <details>
            <summary>View</summary>
            <pre>${JSON.stringify(log.details||{},null,2)}</pre>
          </details>
        </td>
      </tr>
    `).join("")
    : `<tr><td colspan="5">No audit logs found.</td></tr>`;
}

search.addEventListener("keydown",event=>{
  if(event.key==="Enter"){
    loadLogs();
  }
});

loadStats();
loadLogs();
</script>
<script src="script.js"></script>
</body>
</html>
