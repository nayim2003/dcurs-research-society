<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | DCURS</title><link rel="stylesheet" href="style.css?v=20260830"><style>main{min-height:70vh;display:grid;place-items:center;padding:50px 20px;background:#f5f7fb}.box{width:min(420px,100%);background:white;padding:32px;border-radius:20px;border:1px solid #e4e9f1;box-shadow:0 15px 40px #06244b12}label{display:block;margin:14px 0 6px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d6deea;border-radius:10px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:999px;background:#06244b;color:white;font-weight:800}#e{color:#b42318;text-align:center;margin-top:12px}</style></head><body><main><section class="box"><p class="section-label">SECURE ACCESS</p><h1>Admin Login</h1><form id="f"><label>Username</label><input id="u" required autocomplete="username"><label>Password</label><input id="p" type="password" required autocomplete="current-password"><button>Sign in</button><div id="e"></div></form></section></main><script>f.onsubmit=async e=>{e.preventDefault();document.getElementById('e').textContent='';try{let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value.trim(),password:p.value})});let d=await r.json();if(!r.ok||!d.token)throw Error(d.error||'Login failed');localStorage.setItem('adminToken',d.token);location.href='admin.html'}catch(x){document.getElementById('e').textContent=x.message}}</script></body></html>
