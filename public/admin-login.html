<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | DCURS</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-login-page{min-height:calc(100vh - 170px);display:grid;place-items:center;padding:60px 20px;background:#f7f9fc}
.admin-login-card{width:min(440px,100%);background:#fff;border:1px solid #e4e9f1;border-radius:22px;padding:32px;box-shadow:0 18px 50px rgba(6,36,75,.08)}
.admin-login-card h1{margin:8px 0 8px;color:#06244b}
.admin-login-card p{color:#667085}
.admin-login-form{display:grid;gap:15px;margin-top:24px}
.admin-login-form label{font-weight:700;color:#24324a;font-size:14px}
.admin-login-form input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d6deea;border-radius:10px;font:inherit}
.admin-login-form button{border:0;padding:13px 18px;border-radius:999px;background:#06244b;color:#fff;font-weight:800;cursor:pointer}
.admin-login-form button:disabled{opacity:.6;cursor:wait}
.admin-login-error{display:none;padding:11px 13px;border-radius:10px;background:#fff1f2;color:#b42318;font-size:14px}
</style>
</head>
<body>
<header class="site-header">
<nav class="nav container">
<a class="brand" href="index.html">
<img src="assets/dcurs-logo.png" alt="DCURS Logo">
<span><strong>Dhaka Central University</strong><small>Research Society</small></span>
</a>
<div class="nav-links"><a href="index.html">Website</a></div>
</nav>
</header>

<main class="admin-login-page">
<section class="admin-login-card">
<p class="section-label">SECURE ACCESS</p>
<h1>Admin Login</h1>
<p>Sign in to manage DCURS research activities.</p>

<form id="adminLoginForm" class="admin-login-form">
<div>
<label for="username">Username</label>
<input id="username" name="username" type="text" autocomplete="username" required>
</div>
<div>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<div id="error" class="admin-login-error"></div>
<button id="submitBtn" type="submit">Sign in</button>
</form>
</section>
</main>

<footer class="footer">
<div class="container dcurs-copyright">© 2026 DCURS Admin Panel</div>
</footer>

<script>
const form=document.getElementById("adminLoginForm");
const errorBox=document.getElementById("error");
const submitBtn=document.getElementById("submitBtn");

form.addEventListener("submit",async(event)=>{
  event.preventDefault();
  errorBox.style.display="none";
  submitBtn.disabled=true;
  submitBtn.textContent="Signing in...";

  try{
    const response=await fetch("/api/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:document.getElementById("username").value.trim(),
        password:document.getElementById("password").value
      })
    });

    const data=await response.json();

    if(!response.ok || !data.token){
      throw new Error(data.error || "Invalid username or password");
    }

    localStorage.setItem("adminToken",data.token);
    window.location.href="admin.html";
  }catch(error){
    errorBox.textContent=error.message || "Unable to sign in";
    errorBox.style.display="block";
  }finally{
    submitBtn.disabled=false;
    submitBtn.textContent="Sign in";
  }
});
</script>
</body>
</html>
