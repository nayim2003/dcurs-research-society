<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | DCURS</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f7f9fc}
.box{max-width:520px;margin:80px auto;padding:38px;background:white;border:1px solid #e4e9f1;border-radius:22px;box-shadow:0 20px 50px rgba(6,36,75,.1)}
.box h1{color:#06244b}
.box p{color:#667085;margin:10px 0 20px}
.box input{width:100%;padding:13px;border:1px solid #d6deea;border-radius:10px;margin-bottom:14px}
.box button{width:100%;border:0}
#message{margin-top:14px}
</style>
</head>
<body>
<main class="container">
<div class="box">
<p class="section-label">ACCOUNT RECOVERY</p>
<h1>Set a new password</h1>
<p>Use 8–72 characters.</p>

<form id="form">
<input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="New password">
<input id="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Confirm new password">
<button class="btn btn-primary" type="submit">Update Password</button>
</form>

<div id="message"></div>
</div>
</main>

<script>
const token=new URLSearchParams(location.search).get("token");

if(!token){
  form.hidden=true;
  message.innerText="Invalid reset link.";
}

form.addEventListener("submit",async e=>{
  e.preventDefault();

  if(password.value!==confirmPassword.value){
    message.innerText="Password and confirm password do not match.";
    return;
  }

  message.innerText="Updating password...";

  try{
    const response=await fetch("/api/auth/reset-password",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        token,
        password:password.value,
        confirm_password:confirmPassword.value
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||"Password reset failed");
    }

    form.reset();
    message.innerHTML=data.message+' <a href="login.html">Go to login</a>';
  }catch(error){
    message.innerText=error.message;
  }
});
</script>
</body>
</html>
