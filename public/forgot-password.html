<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | DCURS</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f7f9fc}
.box{max-width:520px;margin:80px auto;padding:38px;background:white;border:1px solid #e4e9f1;border-radius:22px;box-shadow:0 20px 50px rgba(6,36,75,.1)}
.box h1{color:#06244b}
.box p{color:#667085;margin:10px 0 20px}
.box input{width:100%;padding:13px;border:1px solid #d6deea;border-radius:10px;margin-bottom:14px}
.box button{width:100%;border:0}
#message{margin-top:14px}
</style>
</head>
<body>
<main class="container">
<div class="box">
<p class="section-label">ACCOUNT RECOVERY</p>
<h1>Forgot password?</h1>
<p>Enter your registration email. If an account exists, we will send a reset link.</p>
<form id="form">
<input id="email" type="email" autocomplete="email" required placeholder="Email address">
<button class="btn btn-primary" type="submit">Send Reset Link</button>
</form>
<div id="message"></div>
</div>
</main>

<script>
form.addEventListener("submit",async e=>{
  e.preventDefault();
  message.innerText="Sending...";

  try{
    const response=await fetch("/api/auth/forgot-password",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:email.value})
    });

    const data=await response.json();
    message.innerText=data.message||data.error||"Done";
  }catch{
    message.innerText="Something went wrong.";
  }
});
</script>
</body>
</html>
