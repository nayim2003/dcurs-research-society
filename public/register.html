<h2>Student Registration</h2><form id=f><input name=name placeholder=name><input name=email placeholder=email><input name=password type=password placeholder=password><input name=department placeholder=department><input name=student_id placeholder="Student ID"><textarea name=research_interest placeholder="Research interest"></textarea><button>Register</button></form><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});alert((await r.json()).message||'done')}</script>
